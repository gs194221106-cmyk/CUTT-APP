<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATT MP3 手机试听诊断</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f7f8fa;margin:0;padding:22px;color:#26303c}.wrap{max-width:530px;margin:auto}h1{font-size:21px}.card{background:white;border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 2px 10px #00000009}.tips{color:#626b77;font-size:13px;line-height:1.7}button{background:#eaf2fd;border:1px solid #c5d9f4;border-radius:9px;padding:11px;margin:5px 4px 4px 0;color:#284e80;font-size:13px}input{max-width:100%;margin:10px 0}audio{width:100%;margin-top:12px}pre{white-space:pre-wrap;word-break:break-word;background:#f2f4f7;padding:12px;border-radius:9px;font-size:12px;max-height:290px;overflow:auto}</style></head>
<body><div class="wrap"><h1>CATT · iPhone MP3 诊断</h1><p class="tips">独立测试页，不会修改 CATT。请先选择一条 ElevenLabs MP3，再尝试以下几种播放方式。建议放到 GitHub Pages 用 HTTPS 打开。</p>
<div class="card"><b>① 选择你的 MP3 / M4A</b><input id="f" type="file" accept=".mp3,.m4a,audio/mpeg,audio/mp4"><div id="info" class="tips">尚未选择文件</div></div>
<div class="card"><b>② 手机原生播放器</b><audio id="audio" preload="metadata" controls playsinline></audio><p class="tips">点上方原生播放按钮。如果这里能播放，而下面不能，通常是 JS 调用方式的问题。</p></div>
<div class="card"><b>③ 点击测试不同方式</b><div><button id="direct">直接 HTMLAudio.play()</button><button id="delayed">异步读取后 play()</button><button id="web">Web Audio 解码</button><button id="stop">停止播放</button></div></div>
<div class="card"><b>④ 测试日志</b><pre id="log">请先选择文件</pre><button id="copy">复制日志</button></div></div>
<script>
const f=document.getElementById('f'),audio=document.getElementById('audio'),info=document.getElementById('info'),log=document.getElementById('log');let file=null,url=null,ctx=null,source=null;
function say(s){log.textContent+='\n'+new Date().toLocaleTimeString()+' '+s;log.scrollTop=log.scrollHeight}function err(e){return (e&&e.name?e.name+': ':'')+(e&&e.message||String(e))}function stop(){try{audio.pause()}catch(e){}try{if(source){source.stop();source.disconnect();source=null}}catch(e){} }
f.onchange=()=>{stop();if(url)URL.revokeObjectURL(url);file=f.files[0];if(!file)return;url=URL.createObjectURL(file);audio.src=url;audio.load();info.textContent=`${file.name} / ${file.type||'类型未知'} / ${file.size} 字节`;log.textContent='设备：'+navigator.userAgent+'\n格式：'+(file.type||'未知')+'\nAudio(mpeg)='+audio.canPlayType('audio/mpeg')+'\nAudio(mp4)='+audio.canPlayType('audio/mp4')};
audio.addEventListener('error',()=>say('HTML Audio 错误: '+(audio.error?audio.error.code+' '+audio.error.message:'未知')));['playing','pause','canplay','loadedmetadata','waiting','ended'].forEach(t=>audio.addEventListener(t,()=>say('HTML Audio 事件: '+t)));
document.getElementById('direct').onclick=()=>{if(!file)return say('先选文件');stop();audio.currentTime=0;try{let p=audio.play();say('已请求直接播放');if(p&&p.then)p.then(()=>say('直接 play resolved')).catch(e=>say('直接 play rejected: '+err(e)))}catch(e){say('直接播放异常: '+err(e))}};
document.getElementById('delayed').onclick=async()=>{if(!file)return say('先选文件');stop();try{say('开始等待异步读取');await file.arrayBuffer();say('异步读取完成');await audio.play();say('异步后 play resolved')}catch(e){say('异步后 play rejected: '+err(e))}};
document.getElementById('web').onclick=async()=>{if(!file)return say('先选文件');stop();try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('无 AudioContext');if(!ctx)ctx=new AC();say('AudioContext 状态='+ctx.state);const resume=ctx.resume();const bufferPromise=file.arrayBuffer();await resume;say('resume 后状态='+ctx.state);const b=await ctx.decodeAudioData(await bufferPromise);say('解码成功：'+b.duration.toFixed(2)+'秒');source=ctx.createBufferSource();source.buffer=b;source.connect(ctx.destination);source.start();say('Web Audio source.start 成功');source.onended=()=>say('Web Audio ended')}catch(e){say('Web Audio 失败: '+err(e))}};
document.getElementById('stop').onclick=()=>{stop();say('停止播放')};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(log.textContent);say('日志复制成功')}catch(e){say('无法复制：'+err(e));const r=document.createRange();r.selectNodeContents(log);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
